plugins {
    id "com.android.application"
}

// 서명 키는 GitHub Actions 비밀값(QUICKDIC_KEYSTORE_*)에서 받습니다.
// 같은 키로 서명해야 새 버전을 덮어 설치할 수 있어요. 없으면 디버그 키로 만듭니다.
def ksFile = System.getenv("QUICKDIC_KEYSTORE_FILE")
def hasKey = ksFile != null && file(ksFile).exists()

android {
    namespace "io.github.kokanggov.quickdic"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.kokanggov.quickdic"
        minSdk 24
        targetSdk 35
        versionCode((System.getenv("QUICKDIC_VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("QUICKDIC_VERSION_NAME") ?: "1.0.0")
        // 웹앱 주소 (저장소마다 다르므로 빌드할 때 넣음)
        buildConfigField "String", "WEB_APP_URL", "\"" + (System.getenv("QUICKDIC_WEB_URL") ?: "https://kokanggov.github.io/quickdic/") + "\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("QUICKDIC_KEYSTORE_PASSWORD")
                keyAlias "quickdic"
                keyPassword System.getenv("QUICKDIC_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
